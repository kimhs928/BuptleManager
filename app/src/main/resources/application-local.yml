spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

buptle:
  # 로그인 구현 전 개발용. 시드 데이터(작업 유저, 고객사 샘플)를 기동 시 채운다.
  dev-seed:
    enabled: true
  dev-user:
    email: dev@buptle.local
    name: 홍길동
