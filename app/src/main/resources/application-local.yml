spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:***}:${DB_PORT:***}/${DB_NAME:***}"
    username: "${DB_USERNAME:***}"
    password: "${DB_PASSWORD:***}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
